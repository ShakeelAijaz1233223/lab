<body>

<!-- Boot screen ------------------------------------------------------- -->
<div id="appLoader" role="status" aria-live="polite">
  <div class="boot">
    <div class="boot-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path>
      </svg>
    </div>
    <div class="boot-title">Shakeel Networking</div>
    <div class="boot-msg">Loading your local data…</div>
    <div class="boot-bar"><span></span></div>
  </div>
</div>

<a href="#appMain" class="skip-link">Skip to main content</a>

<!-- Application shell -------------------------------------------------- -->
<div class="app-shell">

  <!-- Brand -->
  <div class="brand">
    <div class="brand-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path>
      </svg>
    </div>
    <div class="brand-text">
      <div class="brand-name">Shakeel Networking</div>
      <div class="brand-sub">Management System</div>
    </div>
  </div>

  <!-- Header -->
  <header class="app-header" role="banner">
    <button type="button" class="icon-btn" id="sidebarToggle" aria-label="Toggle navigation menu" title="Toggle menu (collapse sidebar)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"></path></svg>
    </button>

    <div class="global-search" role="search">
      <span class="gs-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      </span>
      <label class="sr-only" for="globalSearch">Search all records</label>
      <input type="text" id="globalSearch" placeholder="Search PCs, staff, maintenance, store items, purchases…"
             autocomplete="off" role="combobox" aria-expanded="false" aria-controls="gsResults" aria-autocomplete="list">
      <span class="gs-kbd" aria-hidden="true">Ctrl K</span>
      <div class="gs-results" id="gsResults" role="listbox" aria-label="Search results"></div>
    </div>

    <div class="header-right">
      <div class="header-clock" aria-hidden="true">
        <div class="hc-time">--:--</div>
        <div class="hc-date">—</div>
      </div>

      <span class="hdr-sep" aria-hidden="true"></span>

      <button type="button" class="icon-btn" id="quickAddBtn" aria-label="Quick add a record" title="Quick add (N)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>

      <div class="dropdown-wrap">
        <button type="button" class="icon-btn" id="alertsBtn" aria-label="Alerts" aria-expanded="false" aria-haspopup="true" title="Alerts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
          <span class="icon-badge hidden" id="alertCount">0</span>
        </button>
        <div class="dropdown-panel" id="alertsPanel" role="menu" aria-label="Alerts">
          <div class="dropdown-head">Alerts &amp; attention required</div>
          <div class="dropdown-body"></div>
          <div class="dropdown-foot">Alerts are generated live from your records</div>
        </div>
      </div>

      <span class="hdr-sep" aria-hidden="true"></span>

      <div class="dropdown-wrap">
        <button type="button" class="profile-chip" id="profileBtn" aria-expanded="false" aria-haspopup="true">
          <span class="avatar" id="profileAvatar">AD</span>
          <span class="profile-meta">
            <span class="profile-name" id="profileName">Shakeel Ahmed</span>
            <span class="profile-role" id="profileRole">Admin</span>
          </span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
        <div class="dropdown-panel right" id="profilePanel" role="menu" aria-label="Account menu">
          <div class="dropdown-head">Application</div>
          <div class="dropdown-body">
            <button type="button" class="dd-item" data-go="settings" role="menuitem">
              <span class="dd-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a1.7 1.7 0 0 0-1.5-1H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 3 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 3.6V3a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 20.4 9v0c.1.7.7 1.2 1.4 1.2H22a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></span>
              <span class="dd-body"><span class="dd-title">Settings</span><span class="dd-sub">Labs, preferences, data</span></span>
            </button>
            <button type="button" class="dd-item" data-go="backup" role="menuitem">
              <span class="dd-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><path d="M17 21v-8H7v8M7 3v5h8"></path></svg></span>
              <span class="dd-body"><span class="dd-title">Export full backup</span><span class="dd-sub">Download a .json backup now</span></span>
            </button>
            <button type="button" class="dd-item" data-go="reports" role="menuitem">
              <span class="dd-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="M7 15l4-5 3 3 5-7"></path></svg></span>
              <span class="dd-body"><span class="dd-title">Reports</span><span class="dd-sub">Generate Excel reports</span></span>
            </button>
          </div>
          <div class="dropdown-foot">All data stays on this computer</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <nav class="app-sidebar" id="appSidebar" aria-label="Main navigation">
    <div class="nav-list" id="navList"></div>
    <div class="sidebar-foot">
      <div class="storage-meter" title="Approximate LocalStorage usage">
        <div class="sm-top"><span>Local storage</span><span class="sm-value">0 B</span></div>
        <div class="sm-bar"><div class="sm-fill" style="width:1%"></div></div>
      </div>
      <div class="sidebar-note">Offline · data stored in this browser</div>
    </div>
  </nav>

  <!-- Main -->
  <main class="app-main" id="appMain" tabindex="-1"></main>

  <div class="sidebar-backdrop" aria-hidden="true"></div>
</div>
